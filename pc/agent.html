}

function pPhoto(name,x,y,w,h,key,r=7){let id='pp-'+ ++serial;return art(name,x,y,w,h,'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><clipPath id="'+id+'"><rect width="'+w+'" height="'+h+'" rx="'+r+'"/></clipPath></defs><image width="'+w+'" height="'+h+'" href="'+PORTAL_PHOTOS[key]+'" preserveAspectRatio="'+(key==='map'?'xMidYMid meet':'xMidYMid slice')+'" clip-path="url(#'+id+')"/></svg>');}
function pCard(title,x,y,w,h,kind,number){let n=frame(title,x,y,w,h,[rect('门户卡片底板',0,0,w,h,'#FFFFFF',10,{border:'1px solid #E5E8EE'}),rect('模块图标底',18,18,27,27,'#FFF0E9',7),icon(kind,24,24,15,C.red),text(title,55,17,w-105,17,C.ink,700,29),text(number, w-63,18,45,10,'#D5A584',600,26),rect('模块标题强调线',19,50,22,2,C.orange,1)]);return n;}
function pCombo(name,x,y,w,h,kind='revenue'){
 const id='p-chart-'+ ++serial,padL=34,padR=25,padT=22,padB=25,pw=w-padL-padR,ph=h-padT-padB;
 const actual=kind==='asset'?[56,83,110,138,62,136]:kind==='investment'?[150,78,172,143,118,72]:[120,70,135,108,96,63],budget=kind==='asset'?[50,90,110,122,62,125]:kind==='investment'?[142,82,155,128,112,65]:[110,65,120,95,90,50],max=180;
 let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F6493D"/><stop offset="1" stop-color="#E42032"/></linearGradient></defs>';
 svg+='<text x="2" y="11" font-size="9" font-family="Microsoft YaHei" fill="#9A9FAC">'+(kind==='asset'?'万元':'亿元')+'</text><text x="'+(w-28)+'" y="11" font-size="9" font-family="Microsoft YaHei" fill="#BA7A38">%</text>';
